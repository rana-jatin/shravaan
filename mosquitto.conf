# Broker configuration for the LOCAL DEVELOPMENT stack.
#
# ⚠ DEVELOPMENT ONLY — `allow_anonymous true` means any client that can reach
# this listener may publish anything. The consumer subscribes to
# `shravaan/devices/+/sos`, so an anonymous publisher who knows or guesses a
# device id can raise a false alarm on a family, or bury a real one in noise.
# Unlike POST /api/v1/alerts/sos, which requires a signed device token, the
# MQTT path authenticates nothing.
#
# docker-compose.yml therefore binds this listener to 127.0.0.1 only. Before
# this reaches a real deployment it needs a password file and per-device ACLs
# restricting each device to its own topic — the settings are already there
# (MQTT_USERNAME / MQTT_PASSWORD), the broker side is not.

listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
