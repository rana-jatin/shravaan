services:
  voice-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      SHRAVAAN_API_URL: http://shravaan-api:8000
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      shravaan-api:
        condition: service_healthy

  shravaan-api:
    build:
      context: ./elderguard-backend
    env_file: ./elderguard-backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://shravaan:shravaan@db:5432/shravaan
      REDIS_URL: redis://redis:6379/0
      MQTT_ENABLED: "true"
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: "1883"
      RELATIVE_EMAILS: ""
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shravaan
      POSTGRES_USER: shravaan
      POSTGRES_PASSWORD: shravaan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shravaan -d shravaan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  postgres_data:
  redis_data: